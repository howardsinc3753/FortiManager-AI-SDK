---
canonical_id: org.ulysses.noc.fortimanager-model-device-import-csv/1.0.0
name: FortiManager Model Device Import CSV
version: 1.0.0
description: >
  Bulk-create model devices from a CSV file, mirroring the FMG GUI's
  "Add Model Devices from CSV" flow. Reads the CSV locally, parses per FMG
  format (required cols: Serial Number, Device Blueprint, Name; extra cols
  become per-device meta variables), builds a single add-dev-list payload,
  and fires exec /dvm/cmd/add/dev-list. Optional task polling with per-row
  device verification.
status: draft

metadata:
  org_namespace: ulysses
  domain: noc
  intent: configure
  vendor: fortinet
  shelf: noc/fortimanager
  tags: [fortimanager, fmg, model, device, csv, bulk, import, ztp, mssp, onboarding]

runtime:
  language: python
  entry_point: main
  python_packages: [pyyaml]
  dotnet_packages: []
  files: []
  services: []

parameters:
  type: object
  required: [fmg_host, adom, csv_path]
  properties:
    fmg_host: {type: string}
    adom: {type: string, description: "Target ADOM"}
    csv_path:
      type: string
      description: "Absolute path to the CSV file on the local filesystem"
    default_platform:
      type: string
      description: "Fallback platform if a row's blueprint lookup doesn't resolve platform (e.g. FortiGate-50G)"
    default_os_type: {type: integer, default: 0, description: "0=fos"}
    default_os_ver: {type: integer, default: 7, description: "Major FOS version"}
    default_mr: {type: integer, default: 6, description: "Minor FOS version"}
    default_mgmt_mode: {type: integer, default: 3, description: "3=fmg"}
    default_adm_usr: {type: string, default: admin}
    default_adm_pass: {type: string, default: "", description: "Admin password if not per-row"}
    default_description: {type: string, default: "Model device (CSV import)"}
    faz_perm: {type: integer, default: 15}
    faz_quota: {type: integer, default: 0}
    resolve_blueprint_platform:
      type: boolean
      default: true
      description: "If true, look up each blueprint's platform from FMG so _platform is filled per row"
    wait: {type: boolean, default: true, description: "Poll task to terminal state"}
    max_wait_sec: {type: integer, default: 120}
    dry_run:
      type: boolean
      default: false
      description: "Parse the CSV and build the payload without POSTing"

output_schema:
  type: object
  properties:
    success: {type: boolean}
    action: {type: string, enum: [imported, dry-run, partial, failed]}
    adom: {type: string}
    csv_path: {type: string}
    rows_parsed: {type: integer}
    task_id: {type: integer}
    task_state: {type: string}
    devices_created: {type: array, items: {type: object}, description: "Per-row: {name, sn, blueprint, oid, in_dvm}"}
    devices_failed: {type: array, items: {type: object}}
    payload_sent: {type: object}
    error: {type: string}

credentials:
  - name: fortimanager
    type: username_password

capabilities:
  network:
    outbound: [{host: "{fmg_host}", port: 443, protocol: https}]
    inbound: []
  filesystem:
    read: ["~/.config/mcp/fortimanager_credentials.yaml", "{csv_path}"]
    write: []
  process:
    spawn: false
    elevated: false
  max_execution_time_ms: 300000
