---
canonical_id: org.ulysses.noc.fortimanager-model-device-import-csv/1.2.1
name: FortiManager Model Device Import CSV
version: 1.2.1
description: >
  Bulk-create model devices from a CSV file, mirroring the FMG GUI's
  "Add Model Devices from CSV" flow. Reads the CSV locally, parses per FMG
  format (required cols: Serial Number, Device Blueprint, Name; extra cols
  become per-device meta variables), builds a single add-dev-list payload,
  and fires exec /dvm/cmd/add/dev-list. Optional task polling with per-row
  device verification.

  v1.1.0 adds opt-in `auto_bind` post-import: appends new devices to a CLI
  Template Group scope member, a Policy Package scope member, a DVMDB Device
  Group, and per-normalized-interface dynamic_mapping. `resolve_from_blueprint`
  can auto-infer template_group + policy_package from the first row's
  blueprint (cliprofs[0] + pkg). Note: FMG blueprints with `port-provisioning:
  1` already auto-bind template + policy scope at device creation — the tool
  dedupes and reports "nothing to add" in that case.
status: draft

metadata:
  org_namespace: ulysses
  domain: noc
  intent: configure
  vendor: fortinet
  shelf: noc/fortimanager
  tags: [fortimanager, fmg, model, device, csv, bulk, import, ztp, mssp, onboarding]

runtime:
  language: python
  entry_point: main
  python_packages: [pyyaml]
  dotnet_packages: []
  files: []
  services: []

parameters:
  type: object
  required: [fmg_host, adom, csv_path]
  properties:
    fmg_host: {type: string}
    adom: {type: string, description: "Target ADOM"}
    csv_path:
      type: string
      description: "Absolute path to the CSV file on the local filesystem"
    default_platform:
      type: string
      description: "Fallback platform if a row's blueprint lookup doesn't resolve platform (e.g. FortiGate-50G)"
    default_os_type: {type: integer, default: 0, description: "0=fos"}
    default_os_ver: {type: integer, default: 7, description: "Major FOS version"}
    default_mr: {type: integer, default: 6, description: "Minor FOS version"}
    default_mgmt_mode: {type: integer, default: 3, description: "3=fmg"}
    default_adm_usr: {type: string, default: admin}
    default_adm_pass: {type: string, default: "", description: "Admin password if not per-row"}
    default_description: {type: string, default: "Model device (CSV import)"}
    faz_perm: {type: integer, default: 15}
    faz_quota: {type: integer, default: 0}
    resolve_blueprint_platform:
      type: boolean
      default: true
      description: "If true, look up each blueprint's platform from FMG so _platform is filled per row"
    wait: {type: boolean, default: true, description: "Poll task to terminal state"}
    max_wait_sec: {type: integer, default: 120}
    dry_run:
      type: boolean
      default: false
      description: "Parse the CSV and build the payload without POSTing"
    set_hostname_from_name:
      type: boolean
      default: true
      description: >
        v1.2.0: After per-row DVM verify, update each device's `hostname`
        field to its `name` (FMG's add-dev-list defaults hostname=sn until
        first install refresh — this makes GUI + policy headers show the
        friendly name immediately).
    pre_create_zone_shells:
      type: boolean
      default: true
      description: >
        v1.2.0: When adding normalized-interface dynamic_mapping, first
        `set /pm/config/device/{dev}/vdom/{vdom}/system/zone/{zone}` to
        create an empty zone shell device-side so FMG's -10131 datasrc
        validation passes. CLI templates populate the zone at install time.
    auto_bind:
      type: object
      description: >
        v1.1.0: Opt-in post-import bindings. Runs ONLY if the import succeeded
        and at least one device was created. Any missing field is skipped.
      properties:
        resolve_from_blueprint:
          type: boolean
          default: false
          description: >
            If true and template_group/policy_package are omitted, infer them
            from the first row's blueprint (cliprofs[0] + pkg).
        template_group:
          type: string
          description: "CLI Template Group name to append new devices to (scope member)."
        policy_package:
          type: string
          description: "Policy Package name to append new devices to (scope member)."
        device_group:
          type: string
          description: >
            DVMDB Device Group name to add new devices to (object member).
            NOTE: FMG 7.6.7 API accepts the write (code=0) but has no readback —
            verify in the GUI. See device-group-create tool for details.
        normalized_interfaces:
          type: array
          description: >
            Normalized interfaces to add dynamic_mapping for. Each entry is
            either a string (name; local_intf defaults to same value,
            zone_type=system) or an object {name, local_intf, zone_type}.

            v1.2.1: `zone_type` controls WHICH zone table the pre-create
            shell goes into:
              - "system" (default): /system/zone/{name} — plain L2/L3 zone
                (LAN_ZONE, DMZ_ZONE, etc.)
              - "sdwan":            /system/sdwan/zone/{name} — SDWAN zone
                (SDWAN_ZONE, Underlay_ZONE, etc.). REQUIRED for zones that
                share names with what the SDWAN template creates, otherwise
                install fails with -553 namespace collision.
              - "none":             skip shell entirely; rely on prior
                install having created the zone. dynamic_mapping ADD may
                fail with -10131 on fresh devices.
          items:
            oneOf:
              - type: string
              - type: object
                properties:
                  name: {type: string}
                  local_intf: {type: string}
                  zone_type: {type: string, enum: [system, sdwan, none], default: system}
                required: [name]

output_schema:
  type: object
  properties:
    success: {type: boolean}
    action: {type: string, enum: [imported, dry-run, partial, failed]}
    adom: {type: string}
    csv_path: {type: string}
    rows_parsed: {type: integer}
    task_id: {type: integer}
    task_state: {type: string}
    devices_created: {type: array, items: {type: object}, description: "Per-row: {name, sn, blueprint, oid, in_dvm}"}
    devices_failed: {type: array, items: {type: object}}
    auto_bind:
      type: object
      description: >
        v1.1.0: Post-import binding results (present only if auto_bind was
        provided and the import succeeded). Keys: resolved_from_blueprint,
        template_group, policy_package, device_group, normalized_interfaces.
    payload_sent: {type: object}
    error: {type: string}

credentials:
  - name: fortimanager
    type: username_password

capabilities:
  network:
    outbound: [{host: "{fmg_host}", port: 443, protocol: https}]
    inbound: []
  filesystem:
    read: ["~/.config/mcp/fortimanager_credentials.yaml", "{csv_path}"]
    write: []
  process:
    spawn: false
    elevated: false
  max_execution_time_ms: 300000
