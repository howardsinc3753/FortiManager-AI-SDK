---
canonical_id: org.ulysses.noc.fortimanager-cli-template-group-create/1.0.0
name: FortiManager CLI Template Group Create
version: 1.0.0
description: >
  Create or update a FortiManager CLI Template Group — an ordered bundle of CLI
  templates FMG applies to a device in sequence at install time. Order in the
  members array is preserved (System → Interface → Static → IPsec → BGP → SDWAN
  for SD-WAN builds). Optionally pre-checks that referenced templates exist and
  warns via missing_templates. Idempotent via overwrite=true.
status: draft

metadata:
  org_namespace: ulysses
  domain: noc
  intent: configure
  vendor: fortinet
  shelf: noc/fortimanager
  tags: [fortimanager, fmg, template, cli, group, provisioning]

runtime:
  language: python
  entry_point: main
  python_packages: [pyyaml]
  dotnet_packages: []
  files: []
  services: []

parameters:
  type: object
  required: [fmg_host, name, members]
  properties:
    fmg_host:
      type: string
      description: FortiManager hostname or IP
    adom:
      type: string
      default: root
      description: Target ADOM (tenant scope)
    name:
      type: string
      description: CLI template group name (unique within ADOM)
    members:
      type: array
      items: {type: string}
      minItems: 1
      description: >
        Ordered list of CLI template names to include. Order in the array is the
        FMG execution order at install time — do NOT sort. Typical SD-WAN order:
        [system, interface, static-route, ipsec, bgp, sdwan].
    description:
      type: string
      default: ""
      description: Free-text description shown in FMG GUI
    overwrite:
      type: boolean
      default: false
      description: If true and group exists, update it instead of failing

output_schema:
  type: object
  properties:
    success: {type: boolean}
    action: {type: string, description: "created | updated | noop"}
    name: {type: string}
    adom: {type: string}
    member_count: {type: integer}
    members:
      type: array
      items: {type: string}
    missing_templates:
      type: array
      items: {type: string}
      description: Members whose underlying CLI template was not found in the ADOM (warning only — FMG resolves at install time).
    error: {type: string}

credentials:
  - name: fortimanager
    type: username_password

capabilities:
  network:
    outbound: [{host: "{fmg_host}", port: 443, protocol: https}]
    inbound: []
  filesystem:
    read: ["~/.config/mcp/fortimanager_credentials.yaml"]
    write: []
  process:
    spawn: false
    elevated: false
  max_execution_time_ms: 20000
