  members:
  - BOR-DUAL-01-SYSTEM-GLOBAL
  - BOR-DUAL-03-INTERFACES-VM
  - BOR-DUAL-04-ZONE-LAN
  - BOR-DUAL-05-IPSEC-P1-P2
  - BOR-DUAL-07-STATIC-ROUTES
  - BOR-DUAL-08-BGP
  - BOR-DUAL-09-SDWAN-BASE
  - BOR-DUAL-11-SDWAN-RULES
- name: BOR-DUAL-STD-HW
  description: BOR dual circuit spoke for 30G 50G 120G HW
  members:
  - BOR-DUAL-01-SYSTEM-GLOBAL
  - BOR-DUAL-03-INTERFACES-HW
  - BOR-DUAL-04-ZONE-LAN
  - BOR-DUAL-05-IPSEC-P1-P2
  - BOR-DUAL-07-STATIC-ROUTES
  - BOR-DUAL-08-BGP
  - BOR-DUAL-09-SDWAN-BASE
  - BOR-DUAL-11-SDWAN-RULES
- name: BOR-SPA-DUAL-STD-VM
  description: BOR SPA hub dual circuit for VM Extreme Fork
  members:
  - BOR-SPA-DUAL-01-SYSTEM-GLOBAL
  - BOR-SPA-DUAL-03-INTERFACES-VM
  - BOR-SPA-DUAL-04-ZONE-LAN
  - BOR-SPA-DUAL-05-IPSEC-P1-P2
  - BOR-SPA-DUAL-20-LOOPBACK
  - BOR-SPA-DUAL-21-SASE-HUB-IPSEC
  - BOR-SPA-DUAL-22-STATIC-ROUTES
  - BOR-SPA-DUAL-23-BGP-RR
  - BOR-SPA-DUAL-24-SDWAN
- name: BOR-SPA-DUAL-STD-HW
  description: BOR SPA hub dual circuit for 30G 50G 120G HW Extreme Fork
  members:
  - BOR-SPA-DUAL-01-SYSTEM-GLOBAL
  - BOR-SPA-DUAL-03-INTERFACES-HW
  - BOR-SPA-DUAL-04-ZONE-LAN
  - BOR-SPA-DUAL-05-IPSEC-P1-P2
  - BOR-SPA-DUAL-20-LOOPBACK
  - BOR-SPA-DUAL-21-SASE-HUB-IPSEC
  - BOR-SPA-DUAL-22-STATIC-ROUTES
  - BOR-SPA-DUAL-23-BGP-RR
  - BOR-SPA-DUAL-24-SDWAN
policy_packages:
- name: BOR-SPOKE-STD-PKG
  type: pkg
  policies:
  - policyid: 1
    name: LAN to BOR (SIA)
    srcintf:
    - LAN_ZONE
    dstintf:
    - SDWAN_ZONE
    srcaddr:
    - LOCAL-LAN
    dstaddr:
    - all
    action: 1
    schedule:
    - always
    service:
    - ALL
    nat: 0
    logtraffic: 2
  - policyid: 2
    name: BOR to LAN (return)
    srcintf:
    - SDWAN_ZONE
    dstintf:
    - LAN_ZONE
    srcaddr:
    - all
    dstaddr:
    - LOCAL-LAN
    action: 1
    schedule:
    - always
    service:
    - ALL
    nat: 0
    logtraffic: 2
  - policyid: 3
    name: LAN to Underlay (fallback)
    srcintf:
    - LAN_ZONE
    dstintf:
    - Underlay_ZONE
    srcaddr:
    - LOCAL-LAN
    dstaddr:
    - all
    action: 1
    schedule:
    - always
    service:
    - ALL
    nat: 1
    logtraffic: 2
  shaping_policies:
  - id: 1
    name: BOR_OUTBOUND_SHAPER
    service:
    - ALL
    srcaddr:
    - all
    dstaddr:
    - all
    dstintf:
    - SDWAN_ZONE
    traffic_shaper:
    - BOR_UP_SHAPER
    traffic_shaper_reverse:
    - BOR_DOWN_SHAPER
- name: BOR-SPA-HUB-STD-PKG
  type: pkg
  policies:
  - policyid: 1
    name: SDWAN-Hairpin (spoke-to-spoke)
    srcintf:
    - SDWAN_ZONE
    dstintf:
    - SDWAN_ZONE
    srcaddr:
    - all
    dstaddr:
    - all
    action: 1
    schedule:
    - always
    service:
    - ALL
    nat: 0
    logtraffic: 2
  - policyid: 2
    name: LAN to BOR Private no-SNAT
    srcintf:
    - LAN_ZONE
    dstintf:
    - SDWAN_ZONE
    srcaddr:
    - LOCAL-LAN
    dstaddr:
    - RFC1918-10
    - RFC1918-172
    - RFC1918-192
    action: 1
    schedule:
    - always
    service:
    - ALL
    nat: 0
    logtraffic: 2
  - policyid: 3
    name: LAN to BOR Internet SIA SNAT
    srcintf:
    - LAN_ZONE
    dstintf:
    - SDWAN_ZONE
    srcaddr:
    - LOCAL-LAN
    dstaddr:
    - all
    action: 1
    schedule:
    - always
    service:
    - ALL
    nat: 1
    logtraffic: 2
  - policyid: 4
    name: BOR to LAN return
    srcintf:
    - SDWAN_ZONE
    dstintf:
    - LAN_ZONE
    srcaddr:
    - all
    dstaddr:
    - LOCAL-LAN
    action: 1
    schedule:
    - always
    service:
    - ALL
    nat: 0
    logtraffic: null
  - policyid: 6
    name: LAN to Underlay fallback
    srcintf:
    - LAN_ZONE
    dstintf:
    - Underlay_ZONE
    srcaddr:
    - LOCAL-LAN
    dstaddr:
    - all
    action: 1
    schedule:
    - always
    service:
    - ALL
    nat: 1
    logtraffic: 2
  shaping_policies:
  - id: 1
    name: BOR_OUTBOUND_SHAPER
    service:
    - ALL
    srcaddr:
    - all
    dstaddr:
    - all
    dstintf:
    - SDWAN_ZONE
    traffic_shaper:
    - BOR_UP_SHAPER
    traffic_shaper_reverse:
    - BOR_DOWN_SHAPER
firewall_addresses:
- name: BOR_Primary_PUBLIC
  type: 2
  subnet:
  - 0.0.0.0
  - 0.0.0.0
  fqdn: ipsec-<tenant>-dfw-f3.prod.fortisase.com
  allow_routing: 1
- name: BOR_Secondary_PUBLIC
  type: 2
  subnet:
  - 0.0.0.0
  - 0.0.0.0
  fqdn: ipsec-<tenant>-mia-f3.prod.fortisase.com
  allow_routing: 1
- name: LOCAL-LAN
  type: 0
  subnet:
  - $(LAN_SUBNET)
  - $(LAN_MASK)
  allow_routing: 0
- name: BOR_Primary1_PUBLIC
  type: 2
  fqdn: $(POP1_FQDN)
  allow_routing: 1
- name: BOR_Primary2_PUBLIC
  type: 2
  fqdn: $(POP1_FQDN)
  allow_routing: 1
- name: BOR_Secondary1_PUBLIC
  type: 2
  fqdn: $(POP2_FQDN)
  allow_routing: 1
- name: BOR_Secondary2_PUBLIC
  type: 2
  fqdn: $(POP2_FQDN)
  allow_routing: 1
shapers:
- name: BOR_DOWN_SHAPER
  guaranteed_bandwidth: 0
  maximum_bandwidth: 100
  bandwidth_unit: 1
- name: BOR_UP_SHAPER
  guaranteed_bandwidth: 0
  maximum_bandwidth: 100
  bandwidth_unit: 1
