device_groups:
- name: BOR_Branch_Dual
  description: Dual-BOR branches (two WAN circuits + two SASE tunnels per site)
  type: normal
  os_type: fos
- name: BOR_Branch_SPA_Hub
  description: FortiSASE BOR sites acting as SPA Hub - hairpin spoke to spoke via SDWAN zone
  type: normal
  os_type: fos
- name: BOR_Branch_Single
  description: Single-BOR branches (one WAN circuit + one SASE tunnel per site)
  type: normal
  os_type: fos
